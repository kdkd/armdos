; The ARM Pit BBS configuration
NAME=The ARM Pit
SYSOP=Europa Sysop
LOCATION=Hollywood, FL
NODE=1
PORT=2
; the port is locked at 115200: the modem trains at up to 56K (&B56000 below, V.90
; as a "server") and a 2400 caller still gets 2400 - both modems follow the slower one
BAUD=115200
TIMELIMIT=60
NEWSEC=10
; sent after ATZ; S0=0: the BBS answers RING itself with ATA
INIT=ATE0V1Q0S0=0&C1&D2&B56000
