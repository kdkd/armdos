; MSKERMIT.INI - read by MS-DOS Kermit when it starts.
; The ARM PC's internal 2400 bps modem is on COM2.
set port 2
set speed 2400
set parity none
set terminal bytesize 8
echo \13\10Kermit is on COM2, the ARM PC's modem.  Type CONNECT, then
echo for example ATDT5551989 (the ARM Pit BBS) or ATDT7672676 (the time).
echo Alt-X comes back here; EXIT leaves Kermit.\13\10
